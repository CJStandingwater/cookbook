<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Recipe Browser</title>

    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/themes/splitcomp-pastel-orange.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/browse.css" />
</head>

<body>
    <main class="recipe-browser-page">
        <div class="browser-controls">
            <fieldset>
                <legend>Browser Controls</legend>
                <label>
                    Recipe Search
                    <input type="text" name="recipe-search" placeholder="tags.contains[(fall & dessert) | comfort]" />
                </label>

                <p class="hint">
                    Search: title, authors, tags, tools, difficulty, source, ingredients,
                    or total_minutes. Use contains/excludes for text, equals/under/over
                    for total_minutes, &amp; for AND, | for OR, and parentheses for grouping.
                </p>
            </fieldset>
        </div>

        <p id="browser-status" class="status" role="status">Loading results...</p>

        <article id="recipe-browser" class="recipe-browser" hidden></article>
    </main>

    <script type="module" src="js/browse/browser.js"></script>
</body>
</html>
